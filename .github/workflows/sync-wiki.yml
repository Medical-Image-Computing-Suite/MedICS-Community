name: Sync Wiki

# Copies wiki/*.md from this repo into the GitHub Wiki git remote.
# Requires Wikis enabled on the repository, and a first empty wiki page
# (so MedICS-Community.wiki.git exists).
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync wiki pages
        env:
          # Default GITHUB_TOKEN can push to the wiki of the same repository.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          TMP="$(mktemp -d)"
          # Clone may fail until Wikis are enabled and the wiki repo exists.
          if ! git clone --depth 1 "$WIKI_URL" "$TMP"; then
            echo "::warning::Could not clone ${GITHUB_REPOSITORY}.wiki.git."
            echo "Enable Wikis in repo Settings and create the first wiki page, then re-run."
            exit 0
          fi
          rsync -a --delete \
            --exclude 'README.md' \
            --exclude '.git' \
            wiki/ "$TMP"/
          cd "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${GITHUB_SHA:0:7}"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git push origin "HEAD:refs/heads/${BRANCH}"
